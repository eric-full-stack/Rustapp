services:
  app:
    build: .
    container_name: rust-rcon
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change-me-to-random-64-chars}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-to-random-32-chars}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-changeme}
      - FPS_POLL_INTERVAL=${FPS_POLL_INTERVAL:-30000}
      - PLAYER_POLL_INTERVAL=${PLAYER_POLL_INTERVAL:-15000}
      - FPS_DROP_THRESHOLD=${FPS_DROP_THRESHOLD:-0.30}
    volumes:
      - rcon_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  rcon_data:
    driver: local
